name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    name: Gungraun PR Bench
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@c331e19464518a1b9ea8f35234f6da0c759898a5 # v1.4.1
    with:
      action_ref: c331e19464518a1b9ea8f35234f6da0c759898a5
      runs_on: ubuntu-26.04
      backend: gungraun
      auto_discover: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]
      regression_threshold_pct: 8
      fail_on_regression: true
