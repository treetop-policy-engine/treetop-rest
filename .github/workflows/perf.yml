name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    name: Gungraun PR Bench
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@d24fdffb623edf81ef59100c4d5ab6d730081025 # v1.2.0
    with:
      action_ref: d24fdffb623edf81ef59100c4d5ab6d730081025
      backend: gungraun
      auto_discover: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]
      regression_threshold_pct: 8
      fail_on_regression: true
