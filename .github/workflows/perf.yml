name: Perf

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-pr-bench:
    name: Gungraun PR Bench
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@f5c13e4a9fcac61399967ee365f5b10e7ce992a9 # v1.1.1
    with:
      action_ref: f5c13e4a9fcac61399967ee365f5b10e7ce992a9
      backend: gungraun
      auto_discover: true
      feature_sets_json: >-
        [
          {"name":"default","features":""}
        ]
      regression_threshold_pct: 8
      fail_on_regression: true
