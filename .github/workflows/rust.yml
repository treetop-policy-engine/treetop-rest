# .github/workflows/ci-and-release.yml
name: CI & Release

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: treetop-rest
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}/treetop-rest

jobs:
  build:
    name: Build - Test - Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache Cargo registry/index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache Cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --locked --all-features --verbose
      - name: Verify OpenAPI docs
        run: |
          cargo run --locked --example openapi > docs/openapi.json
          git diff --exit-code docs/openapi.json
      - name: Run tests
        run: cargo test --locked --all-features --verbose
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 --config .markdownlint.json "**/*.md" "!target" "!fuzz/target"
      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit locked dependencies
        run: cargo audit --deny warnings

  publish-develop:
    name: Publish “develop” image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1) Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 2) Build & tag as develop
      - name: Build & push “develop” image
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty)"
          docker build \
            --file Dockerfile \
            --build-arg "GIT_BRANCH=$GIT_BRANCH" \
            --build-arg "GIT_SHA=$GIT_SHA" \
            --build-arg "GIT_DESCRIBE=$GIT_DESCRIBE" \
            --tag "$GHCR_REGISTRY:develop" \
            .
          docker push "$GHCR_REGISTRY:develop"

  publish-release:
    name: "Release: container + binaries"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      TAG: ${{ github.ref_name }}      # e.g. “v1.2.3”
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A) Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # B) Build & push server container under $TAG and “latest”
      - name: Build & push server image
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          GIT_DESCRIBE="$(git describe --tags --always --dirty)"
          docker build \
            --file Dockerfile \
            --build-arg "GIT_BRANCH=$GIT_BRANCH" \
            --build-arg "GIT_SHA=$GIT_SHA" \
            --build-arg "GIT_DESCRIBE=$GIT_DESCRIBE" \
            --tag "$GHCR_REGISTRY:$TAG" \
            --tag "$GHCR_REGISTRY:latest" \
            .
          docker push "$GHCR_REGISTRY:$TAG"
          docker push "$GHCR_REGISTRY:latest"

      # C) Cross-compile the server for Linux x86_64 + ARM (musl)
      - name: Install cross-compilation tool
        run: |
          cargo install cross --version 0.2.5 --locked

      - name: Build native binaries
        run: |
          for TGT in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            CARGO_TARGET_DIR="target/cross-$TGT" cross build --release --target "$TGT"
          done

      - name: Package artifacts
        run: |
          mkdir release-artifacts
          for TGT in x86_64 aarch64; do
            TRIPLE=${TGT}-unknown-linux-musl
            BIN_X=target/cross-${TRIPLE}/${TRIPLE}/release
            tar czf "release-artifacts/treetop-server-${TGT}-linux-musl.tar.gz" -C "$BIN_X" treetop-server
          done

      # D) Create GH Release & upload binaries
      - name: Create GitHub Release & upload binaries
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          artifacts: |
            release-artifacts/treetop-server-x86_64-linux-musl.tar.gz
            release-artifacts/treetop-server-aarch64-linux-musl.tar.gz
