[package]
name = "treetop-rest"
version = "0.1.0"
edition = "2024"
description = "REST server for the Treetop policy management framework"
license = "MIT"
repository = "https://github.com/treetop-policy-engine/treetop-rest"
publish = false
build = "build.rs"
autobenches = false

[dependencies]
actix-service = "2.0.3"
actix-web = { version = "4.15.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
futures = "0.3.34"
futures-util = "0.3.34"
ipnet = "2.12.2"
lru = "0.18.4"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-subscriber = { version = "0.3.23", features = [
    "chrono",
    "env-filter",
    "json",
    "serde",
    "serde_json",
] }
treetop-core = { version = "=0.2.0", features = ["observability"] }
treetop-bundle = { version = "=0.2.0", git = "https://github.com/treetop-policy-engine/treetop-bundle", rev = "66ee524a62377a7da0261086a3353bb330c72b54", default-features = false }
prometheus-client = { version = "0.25.1", features = ["prometheus_protobuf", "protobuf-protox"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "vendored"] }
uuid = { version = "1.26.1", features = ["v4"] }
# Keep Cedar aligned with the exact Core and Bundle release dependencies.
cedar-policy = "=4.13.0"

[dev-dependencies]
actix-rt = "2.15.0"
actix-http = "3.13.6"
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
rstest = "0.27.0"
tempfile = "3.27.0"
gungraun = "0.19.4"
treetop-core = { version = "=0.2.0", features = ["bench-internal"] }

[build-dependencies]
cargo_metadata = "0.23.1"
serde_json = "1.0.151"
vergen = { version = "10.0.3", features = [
    "emit_and_set",
    "build",
    "cargo",
    "cargo_metadata",
    "rustc",
    "si",
] }
vergen-gitcl = { version = "10.0.3", features = [
    "emit_and_set",
    "build",
    "cargo",
    "rustc",
    "si",
] }

[[bin]]
name = "treetop-server"
path = "src/bin/server.rs"

[profile.release]
debug = true

