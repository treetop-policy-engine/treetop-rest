[package]
name = "treetop-rest-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"
treetop-rest = { path = ".." }

[[bin]]
name = "authorize_json"
path = "fuzz_targets/authorize_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_updates"
path = "fuzz_targets/state_updates.rs"
test = false
doc = false
bench = false
